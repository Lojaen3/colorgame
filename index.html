<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مصمم السجاد</title>
    <script>
      (function () {
        var path = location.pathname;
        if (!path.endsWith("/") && !/\.[a-z0-9]+$/i.test(path)) {
          location.replace(path + "/" + location.search + location.hash);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1>مصمم السجاد</h1>
        <p class="subtitle" id="page-subtitle">
          جرّب توزيع الألوان بسهولة قبل تنفيذ السجادة.
          حدد المقاس وعدد المربعات ثم لوّن النمط.
        </p>
      </header>

      <main class="layout">
        <aside class="panel" aria-label="أدوات التصميم">
          <section class="size-section" aria-labelledby="size-title">
            <h2 id="size-title">مقاس السجادة</h2>
            <p class="hint">حدد الطول والعرض وعدد المربعات داخل السجادة.</p>

            <form id="size-form" class="size-form">
              <div class="field-grid">
                <label class="field">
                  <span>العرض (متر)</span>
                  <input
                    id="width-input"
                    type="number"
                    inputmode="decimal"
                    min="0.3"
                    max="8"
                    step="0.01"
                    value="2.10"
                    required
                  />
                </label>
                <label class="field">
                  <span>الطول (متر)</span>
                  <input
                    id="length-input"
                    type="number"
                    inputmode="decimal"
                    min="0.3"
                    max="8"
                    step="0.01"
                    value="3"
                    required
                  />
                </label>
                <label class="field">
                  <span>المربعات بالعرض</span>
                  <input
                    id="cols-input"
                    type="number"
                    inputmode="numeric"
                    min="1"
                    max="40"
                    step="1"
                    value="7"
                    required
                  />
                </label>
                <label class="field">
                  <span>المربعات بالطول</span>
                  <input
                    id="rows-input"
                    type="number"
                    inputmode="numeric"
                    min="1"
                    max="50"
                    step="1"
                    value="10"
                    required
                  />
                </label>
              </div>

              <p class="total-preview">
                المجموع: <strong id="total-preview">٧٠</strong> مربعًا
              </p>
              <p id="size-error" class="size-error" role="alert"></p>
              <button type="submit" class="btn btn-secondary">تطبيق المقاس</button>
            </form>
          </section>

          <section class="picker" aria-labelledby="color-title">
            <h2 id="color-title">اختر اللون</h2>
            <p class="hint">حدد عدد الألوان، ثم اختر اللون من البيكر أو اكتب رمزه مثل <span dir="ltr">#171717</span>.</p>

            <label class="field color-count-field">
              <span>عدد الألوان</span>
              <input
                id="color-count-input"
                type="number"
                inputmode="numeric"
                min="1"
                max="8"
                step="1"
                value="2"
              />
            </label>

            <div id="color-list" class="color-list" role="radiogroup" aria-labelledby="color-title"></div>
            <noscript class="hint">فعّل جافاسكربت حتى تظهر الألوان والسجادة.</noscript>
          </section>

          <section id="stats" class="stats" aria-live="polite"></section>

          <div class="actions">
            <button type="button" class="btn btn-secondary" id="swap-btn">
              عكس أماكن الألوان
            </button>
            <button type="button" class="btn btn-ghost" id="fill-btn">
              املأ السجادة باللون المختار
            </button>
            <button type="button" class="btn btn-ghost" id="reset-btn">
              إعادة التعيين
            </button>
          </div>
        </aside>

        <section class="stage" aria-label="السجادة">
          <div class="carpet-wrap">
            <div class="dimension dim-width">
              <span id="width-label">٢٫١٠ م</span>
              <span id="cols-label">٧ مربعات</span>
            </div>

            <div class="carpet-frame">
              <div
                id="carpet"
                class="carpet"
                role="grid"
                aria-label="سجادة ٧ أعمدة و١٠ صفوف"
              ></div>
            </div>

            <div class="dimension dim-length">
              <span id="length-label">٣ م</span>
              <span id="rows-label">١٠ مربعات</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
